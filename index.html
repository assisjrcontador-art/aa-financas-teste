function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY))||clone(SEED))}catch(e){return normalize(clone(SEED))}}
function normalize(d){d.budget=d.budget||{};d.actuals=d.actuals||[];d.categories=d.categories||[];d.cards=d.cards||[];d.reserves=d.reserves||[];d.ferreira=d.ferreira||{};d.version=Math.max(20,+d.version||0);Object.values(d.budget).forEach(m=>{m.income=m.income||[];m.expense=m.expense||[];m.closed=!!m.closed;m.income.forEach(x=>{x.owner=x.owner||incomeOwner(x.category);x.recurring=x.recurring!==false});m.expense.forEach(x=>{x.owner=(x.owner==='Casal'||!x.owner)?guessOwner(x.category):x.owner;x.behavior=x.behavior||guessBehavior(x.category);x.recurring=x.recurring!==false})});return d}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));scheduleSync()}function currentMonth(){let d=new Date(),k=MONTHS[d.getMonth()]+String(d.getFullYear()).slice(-2);return db.budget[k]?k:Object.keys(db.budget).sort(serial).at(-1)}function serial(k){return (2000+ +k.slice(-2))*12+MONTHS.indexOf(k.slice(0,3))}function label(k){return MONTHS.indexOf(k.slice(0,3))>=0?['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][MONTHS.indexOf(k.slice(0,3))]+'/20'+k.slice(-2):k}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function incomeOwner(n){n=norm(n);if(n.includes('andressa')||n.includes('instituto')||n.includes('sus')||n.includes('projeto'))return'Andressa';return'Assis'}function guessOwner(n){n=norm(n);if(n.includes('andressa')||n.includes('apto')||n.includes('internet')||n.includes('plano de saude'))return'Andressa';return'Assis'}function guessBehavior(n){n=norm(n);return ['feira','gasolina','combustivel','farmacia','saldo livre','assis','andressa'].some(v=>n.includes(v))?'consumo':'obrigacao'}
function rows(type,k=month){return db.budget[k]?.[type]||[]}function actualsFor(x,type,k=month){return db.actuals.filter(a=>a.month===k&&a.type===type&&norm(a.category)===norm(x.category)&&(!a.owner||a.owner===(x.owner||incomeOwner(x.category))))}function actual(x,type,k=month){return actualsFor(x,type,k).reduce((s,a)=>s+(+a.amount||0),0)}function inScope(x,type){let o=type==='income'?(x.owner||incomeOwner(x.category)):(x.owner||guessOwner(x.category));return scopeValue==='Casal'||o===scopeValue}function scoped(type,k=month){return rows(type,k).filter(x=>inScope(x,type))}function total(type,real=false,k=month){return scoped(type,k).reduce((s,x)=>s+(real?actual(x,type==='income'?'receita':'despesa',k):(+x.budget||0)),0)}
function isFree(x){let n=norm(x.category);return n==='assis'||n==='andressa'||n.includes('saldo livre')}function freeOwner(x){let n=norm(x.category);return n.includes('andressa')?'Andressa':n.includes('assis')?'Assis':x.owner}function wallet(owner,k=month){let base=rows('expense',k).filter(x=>isFree(x)&&freeOwner(x)===owner).reduce((s,x)=>s+(+x.budget||0),0),spent=rows('expense',k).filter(x=>isFree(x)&&freeOwner(x)===owner).reduce((s,x)=>s+actual(x,'despesa',k),0),variance=rows('expense',k).filter(x=>!isFree(x)&&x.owner===owner&&x.behavior!=='consumo').reduce((s,x)=>{let a=actual(x,'despesa',k);return s+(a>0?(+x.budget||0)-a:0)},0);return{base,spent,variance,available:base+variance-spent}}

function renderReserves(){let rs=db.reserves.filter(r=>scopeValue==='Casal'||r.owner===scopeValue||r.owner==='Casal');let rate=.0078;document.querySelector('#v-reserves').innerHTML='<div class="reserve-grid">'+rs.map((r,i)=>{let val=+r.principal||0,p=r.goal?Math.min(100,val/r.goal*100):0;return'<div class="card reserve"><span class="status ok">'+esc(r.owner)+'</span><h2>'+esc(r.name)+'</h2><strong>'+money(val)+'</strong><div class="sub">'+esc(r.purpose||'Reserva')+'</div><div class="progress"><i style="width:'+p+'%"></i></div><div class="sub" style="margin-top:8px">Projeção em 12 meses: '+money(val*Math.pow(1+(+r.rate||.78)/100,12))+'</div><button class="btn soft" style="margin-top:12px" onclick="editReserve('+i+')">Atualizar</button></div>'}).join('')+'</div><div class="card section"><h2>Evolução projetada da reserva A&A</h2>'+reserveChart()+'</div>'}
function reserveChart(){let r=db.reserves.find(x=>x.id==='aa')||db.reserves[0],v=+r?.principal||0,rate=(+r?.rate||.78)/100,data=[];for(let i=0;i<12;i++){v*=1+rate;data.push(v)}let max=Math.max(...data,1);return'<div class="chart-bars">'+data.map((x,i)=>'<div class="barcol"><b>'+fmt(x).replace('R$ ','')+'</b><i style="height:'+(x/max*150)+'px"></i><span>'+(i+1)+'º</span></div>').join('')+'</div>'}
function categoryData(){let arr=scoped('expense').filter(x=>!isFree(x)).map(x=>[x.category,actual(x,'despesa')||+x.budget||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8),sum=arr.reduce((s,x)=>s+x[1],0),colors=['#138a68','#39ae88','#68c8a8','#d7aa51','#e2c177','#557bdc','#8b68c9','#d06868'],at=0,stops=arr.map((x,i)=>{let p=x[1]/sum*100,s=at;at+=p;return colors[i]+' '+s+'% '+at+'%'}).join(',');return{arr,sum,colors,stops}}
function renderAnalytics(){let d=categoryData();document.querySelector('#v-analytics').innerHTML='<div class="grid2"><div class="card section"><h2>Para onde vai o dinheiro</h2><div class="donut-wrap"><div class="donut" style="background:conic-gradient('+d.stops+')"></div><div class="legend">'+d.arr.map((x,i)=>'<div><span><i style="background:'+d.colors[i]+'"></i>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join('')+'</div></div></div><div class="card section"><h2>Planejado × realizado</h2><div class="chart-bars"><div class="barcol"><b>'+money(total('income'))+'</b><i style="height:160px"></i><span>Receita</span></div><div class="barcol"><b>'+money(total('expense'))+'</b><i style="height:'+(total('income')?total('expense')/total('income')*160:0)+'px"></i><span>Orçado</span></div><div class="barcol"><b>'+money(total('expense',true))+'</b><i style="height:'+(total('income')?total('expense',true)/total('income')*160:0)+'px"></i><span>Gasto</span></div></div></div></div>'}
function renderReport(){let inc=total('income'),exp=total('expense'),ri=total('income',true),re=total('expense',true);document.querySelector('#v-report').innerHTML='<div class="hero"><small>Fechamento de '+label(month)+'</small><strong>'+money(ri-re)+'</strong><span>Resultado realizado</span></div><div class="grid4"><div class="card kpi"><small>Receita total</small><strong>'+money(inc)+'</strong></div><div class="card kpi"><small>Despesa total</small><strong>'+money(exp)+'</strong></div><div class="card kpi"><small>Saldo planejado</small><strong>'+money(inc-exp)+'</strong></div><div class="card kpi"><small>Saldo realizado</small><strong>'+money(ri-re)+'</strong></div></div><div class="card section"><h2>Demonstrativo mensal</h2><div class="tablewrap"><table><thead><tr><th>Descrição</th><th class="right">Planejado</th><th class="right">Realizado</th><th class="right">Diferença</th></tr></thead><tbody><tr><td><b>Receitas</b></td><td class="right">'+money(inc)+'</td><td class="right">'+money(ri)+'</td><td class="right">'+money(ri-inc)+'</td></tr><tr><td><b>Despesas</b></td><td class="right">'+money(exp)+'</td><td class="right">'+money(re)+'</td><td class="right">'+money(exp-re)+'</td></tr><tr><td><b>Saldo final</b></td><td class="right">'+money(inc-exp)+'</td><td class="right">'+money(ri-re)+'</td><td class="right">'+money((ri-re)-(inc-exp))+'</td></tr></tbody></table></div></div><div style="margin-top:14px">'+walletsHTML()+'</div>'}
function renderFerreira(){let f=db.ferreira||{},r=db.reserves.find(x=>x.id==='fi');document.querySelector('#v-ferreira').innerHTML='<div class="hero"><small>Ferreira Imóveis</small><strong>'+money(r?.principal||0)+'</strong><span>Patrimônio separado do casal</span></div><div class="card section"><h2>Visão da empresa</h2><div class="sub">Esta área permanece independente das finanças pessoais.</div><div class="tablewrap" style="margin-top:12px"><table><tbody>'+Object.entries(f).slice(0,20).map(x=>'<tr><td>'+esc(x[0])+'</td><td class="right">'+(typeof x[1]==='number'?money(x[1]):esc(JSON.stringify(x[1])))+'</td></tr>').join('')+'</tbody></table></div></div>'}
function renderFinancing(){let balance=116925,rate=.0425/12,payment=646.47,rows=[];for(let i=0;i<12;i++){let interest=balance*rate,amort=Math.max(0,payment-interest);balance-=amort;rows.push([44+i,payment,interest,amort,balance])}document.querySelector('#v-financing').innerHTML='<div class="grid4"><div class="card kpi"><small>Saldo em 03/09/2026</small><strong>'+money(116925)+'</strong></div><div class="card kpi"><small>Próxima parcela oficial</small><strong>'+money(646.47)+'</strong><span class="sub">03/10/2026 · parcela 44</span></div><div class="card kpi"><small>Taxa nominal</small><strong>4,25% a.a.</strong></div><div class="card kpi"><small>Parcelas restantes</small><strong>317</strong></div></div><div class="card section"><h2>Projeção estimada</h2><div class="sub">Os valores posteriores à parcela 44 são estimativas, não valores contratuais.</div><div class="tablewrap"><table><thead><tr><th>Parcela</th><th class="right">Prestação</th><th class="right">Juros</th><th class="right">Amortização</th><th class="right">Saldo</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x[0]+'</td>'+x.slice(1).map(v=>'<td class="right">'+money(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
function go(p){page=p;render()}function openModal(html){document.querySelector('#dialog').innerHTML=html;document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function quickModal(){let ex=scoped('expense').filter(x=>!isFree(x));openModal('<div class="dialog-head"><h2>Registrar agora</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">O que aconteceu?<select id="qType"><option value="despesa">Fiz um gasto / paguei uma conta</option><option value="receita">Recebi uma receita</option></select></label><label class="full">Categoria<select id="qCat">'+ex.map(x=>'<option value="'+rows('expense').indexOf(x)+'">'+esc(x.category)+' · '+x.owner+'</option>').join('')+'</select></label><label>Valor<input id="qValue" type="number" step=".01" inputmode="decimal" autofocus></label><label>Data<input id="qDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label class="full">Observação (opcional)<input id="qNote"></label><button class="btn primary full" onclick="saveQuick()">Salvar lançamento</button></div>');document.querySelector('#qType').onchange=e=>{let type=e.target.value==='receita'?'income':'expense';document.querySelector('#qCat').innerHTML=scoped(type).map(x=>'<option value="'+rows(type).indexOf(x)+'">'+esc(x.category)+'</option>').join('')}}
function saveQuick(){let type=document.querySelector('#qType').value,arr=rows(type==='receita'?'income':'expense'),x=arr[+document.querySelector('#qCat').value],v=+document.querySelector('#qValue').value||0;if(!x||!v)return toast('Informe categoria e valor');db.actuals.push({id:crypto.randomUUID?.()||'a'+Date.now(),month,category:x.category,type,amount:v,date:document.querySelector('#qDate').value,note:document.querySelector('#qNote').value,owner:x.owner||incomeOwner(x.category)});persist();closeModal();render();toast(type==='receita'?'Receita registrada':'Despesa registrada')}
function openItem(type,i){let x=rows(type)[i];if(!x)return;let kind=type==='income'?'receita':'despesa',acts=actualsFor(x,kind);openModal('<div class="dialog-head"><div><h2>'+esc(isFree(x)?'Saldo Livre — '+freeOwner(x):x.category)+'</h2><div class="sub">'+label(month)+'</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">Nome<input id="eName" value="'+esc(x.category)+'"></label><label>Orçamento<input id="eBudget" type="number" step=".01" value="'+(+x.budget||0)+'"></label><label>Responsável<select id="eOwner"><option '+(x.owner==='Assis'?'selected':'')+'>Assis</option><option '+(x.owner==='Andressa'?'selected':'')+'>Andressa</option></select></label>'+(type==='expense'?'<label class="full">Como funciona?<select id="eBehavior"><option value="consumo" '+(x.behavior==='consumo'?'selected':'')+'>Vou gastando durante o mês</option><option value="obrigacao" '+(x.behavior!=='consumo'?'selected':'')+'>É uma conta a pagar</option></select></label>':'')+'<label class="full"><input id="eRecurring" type="checkbox" '+(x.recurring!==false?'checked':'')+'> Repetir no próximo mês</label><button class="btn primary full" onclick="saveItem(\''+type+'\','+i+')">Salvar alterações</button></div><div class="details"><h3>Lançamentos</h3>'+(acts.length?acts.map(a=>'<div class="money-row"><div><b>'+esc(a.date||'Sem data')+'</b><div class="meta">'+esc(a.note||'Sem observação')+'</div></div><b>'+money(a.amount)+'</b><button class="btn" onclick="editActual(\''+a.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum lançamento realizado.</div>')+'</div><button class="btn danger" onclick="deleteItem(\''+type+'\','+i+')">Excluir deste mês</button>')}
function saveItem(type,i){let x=rows(type)[i],old=x.category,newName=document.querySelector('#eName').value.trim()||old;x.category=newName;x.budget=+document.querySelector('#eBudget').value||0;x.owner=document.querySelector('#eOwner').value;x.recurring=document.querySelector('#eRecurring').checked;if(type==='expense')x.behavior=document.querySelector('#eBehavior').value;db.actuals.forEach(a=>{if(a.month===month&&norm(a.category)===norm(old)){a.category=newName;a.owner=x.owner}});persist();closeModal();render();toast('Alteração salva')}
function deleteItem(type,i){if(!confirm('Excluir este item somente de '+label(month)+'?'))return;rows(type).splice(i,1);persist();closeModal();render()}
function editActual(id){let a=db.actuals.find(x=>x.id===id);if(!a)return;openModal('<div class="dialog-head"><h2>Editar lançamento</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Valor<input id="aValue" type="number" step=".01" value="'+a.amount+'"></label><label>Data<input id="aDate" type="date" value="'+esc(a.date||'')+'"></label><label class="full">Observação<input id="aNote" value="'+esc(a.note||'')+'"></label><button class="btn primary" onclick="saveActual(\''+id+'\')">Salvar</button><button class="btn danger" onclick="deleteActual(\''+id+'\')">Excluir</button></div>')}
function saveActual(id){let a=db.actuals.find(x=>x.id===id);a.amount=+document.querySelector('#aValue').value||0;a.date=document.querySelector('#aDate').value;a.note=document.querySelector('#aNote').value;persist();closeModal();render();toast('Lançamento atualizado')}function deleteActual(id){if(!confirm('Excluir este lançamento?'))return;db.actuals=db.actuals.filter(x=>x.id!==id);persist();closeModal();render();toast('Lançamento excluído')}
function newItem(type){openModal('<div class="dialog-head"><h2>Nova '+(type==='income'?'receita':'despesa')+'</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">Nome<input id="nName" autofocus></label><label>Valor planejado<input id="nBudget" type="number" step=".01"></label><label>Responsável<select id="nOwner"><option '+(scopeValue==='Assis'?'selected':'')+'>Assis</option><option '+(scopeValue==='Andressa'?'selected':'')+'>Andressa</option></select></label>'+(type==='expense'?'<label class="full">Como funciona?<select id="nBehavior"><option value="consumo">Vou gastando durante o mês</option><option value="obrigacao">É uma conta a pagar</option></select></label>':'')+'<label class="full"><input type="checkbox" id="nRecurring" checked> Repetir no próximo mês</label><button class="btn primary full" onclick="saveNew(\''+type+'\')">Adicionar</button></div>')}
function saveNew(type){let name=document.querySelector('#nName').value.trim();if(!name)return toast('Informe um nome');let x={category:name,budget:+document.querySelector('#nBudget').value||0,owner:document.querySelector('#nOwner').value,recurring:document.querySelector('#nRecurring').checked};if(type==='expense')x.behavior=document.querySelector('#nBehavior').value;rows(type).push(x);persist();closeModal();render();toast('Item adicionado')}
function replicateModal(){let keys=Object.keys(db.budget).sort((a,b)=>serial(a)-serial(b)),prev=keys.filter(k=>serial(k)<serial(month)).at(-1);openModal('<div class="dialog-head"><h2>Replicar planejamento</h2><button class="btn" onclick="closeModal()">×</button></div><p>Copiar receitas e despesas recorrentes de <b>'+label(prev)+'</b> para <b>'+label(month)+'</b>?</p><p class="sub">Pagamentos e recebimentos realizados não serão copiados.</p><button class="btn primary" onclick="replicate(\''+prev+'\')">Replicar agora</button>')}
function replicate(from){if(!db.budget[from])return;db.budget[month]={income:db.budget[from].income.filter(x=>x.recurring!==false).map(clone),expense:db.budget[from].expense.filter(x=>x.recurring!==false).map(clone),closed:false};persist();closeModal();render();toast('Planejamento replicado')}
function editReserve(i){let r=db.reserves[i];openModal('<div class="dialog-head"><h2>'+esc(r.name)+'</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Saldo atual<input id="rValue" type="number" step=".01" value="'+(+r.principal||0)+'"></label><label>Taxa mensal (%)<input id="rRate" type="number" step=".01" value="'+(+r.rate||0)+'"></label><label class="full">Meta<input id="rGoal" type="number" step=".01" value="'+(+r.goal||0)+'"></label><button class="btn primary full" onclick="saveReserve('+i+')">Salvar</button></div>')}function saveReserve(i){let r=db.reserves[i];r.principal=+document.querySelector('#rValue').value||0;r.rate=+document.querySelector('#rRate').value||0;r.goal=+document.querySelector('#rGoal').value||0;persist();closeModal();render();toast('Reserva atualizada')}
let audioCtx;function sound(kind){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=kind==='soft'?520:420;g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.055);o.start();o.stop(audioCtx.currentTime+.06)}catch(e){}}
let syncTimer;function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{document.querySelector('#syncText').textContent='Salvo neste aparelho';},300)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();
</script>
</body></html>
