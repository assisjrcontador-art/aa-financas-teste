function reserveRealized(name){let key=norm(name).replace(/^reserva\s+/,''),aliases=key==='a&a'?['a&a','aa']:key==='manutencao crv'?['manutencao crv','carro']:[key];return db.actuals.filter(a=>a.type==='despesa'&&aliases.includes(norm(a.category).replace(/^reserva\s+/,''))).reduce((s,a)=>s+(+a.amount||0),0)}

function reserveChart(){let r=db.reserves.find(x=>x.id==='aa')||db.reserves[0],base=reserveValue(r),rate=(+r?.rate||.78)/100,keys=Object.keys(db.budget).filter(k=>serial(k)>=serial(month)).sort((a,b)=>serial(a)-serial(b)).slice(0,12),solid=base,data=[];keys.forEach(k=>{solid*=1+rate;let planned=rows('expense',k).filter(x=>norm(x.category)==='reserva a&a').reduce((s,x)=>s+(+x.budget||0),0),done=rows('expense',k).filter(x=>norm(x.category)==='reserva a&a').reduce((s,x)=>s+actual(x,'despesa',k),0);data.push({k,solid,planned:Math.max(0,planned-done)})});let max=Math.max(...data.map(x=>x.solid+x.planned),1);return'<div class="chart-bars">'+data.map(x=>'<div class="barcol"><b>'+fmt(x.solid+x.planned).replace('R$ ','')+'</b><div style="height:'+((x.solid+x.planned)/max*150)+'px;display:flex;flex-direction:column;justify-content:flex-end"><i style="height:'+(x.planned/max*150)+'px;background:#a9dfce;min-height:'+(x.planned?3:0)+'px"></i><i style="height:'+(x.solid/max*150)+'px"></i></div><span>'+label(x.k).slice(0,3)+'</span></div>').join('')+'</div>'}

function renderFerreira(){let f=db.ferreira||[],r=db.reserves.find(x=>x.id==='fi'),rec=f.filter(x=>norm(x.type)==='receita'),des=f.filter(x=>norm(x.type)==='despesa'),tr=rec.reduce((s,x)=>s+(+x.budget||0),0),td=des.reduce((s,x)=>s+(+x.budget||0),0),rr=rec.reduce((s,x)=>s+ferreiraActual(x),0),rd=des.reduce((s,x)=>s+ferreiraActual(x),0),saldo=rr-rd,closed=db.reserveMoves.find(x=>x.reserveId==='fi'&&x.month===month);document.querySelector('#v-ferreira').innerHTML='<div class="hero"><small>Ferreira Imóveis · '+label(month)+'</small><strong>'+money(saldo)+'</strong><span>Saldo realizado do mês</span></div><div class="grid4"><div class="card kpi"><small>Receitas</small><strong>'+money(rr)+'</strong><span class="sub">Planejado '+money(tr)+'</span></div><div class="card kpi"><small>Despesas</small><strong>'+money(rd)+'</strong><span class="sub">Planejado '+money(td)+'</span></div><div class="card kpi"><small>Saldo final</small><strong>'+money(saldo)+'</strong></div><div class="card kpi"><small>Reserva Ferreira Imóveis</small><strong>'+money(reserveValue(r))+'</strong></div></div><div class="toolbar" style="margin-top:14px"><div class="sub">O saldo pertence à Ferreira Imóveis e não integra o patrimônio do casal.</div><button class="btn '+(closed?'soft':'primary')+'" onclick="finalizeFerreira()">'+(closed?'Mês finalizado':'Finalizar mês e transferir saldo')+'</button></div><div class="grid2"><div class="card section"><h2>Recebimentos</h2>'+ferreiraRows(rec)+'</div><div class="card section"><h2>Pagamentos</h2>'+ferreiraRows(des)+'</div></div>'}

function saveFerreira(i){let x=db.ferreira[i],v=+document.querySelector('#fActual').value||0;x.budget=+document.querySelector('#fBudget').value||0;db.ferreiraActuals=db.ferreiraActuals.filter(a=>!(a.month===month&&norm(a.description)===norm(x.description)&&norm(a.type)===norm(x.type)));if(v)db.ferreiraActuals.push({id:'f'+Date.now(),month,type:x.type,description:x.description,amount:v});persist();closeModal();render();toast('Movimentação atualizada')}

function quickModal(){let ex=scoped('expense').filter(x=>!isFree(x));openModal('<div class="dialog-head"><h2>Registrar agora</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">O que aconteceu?<select id="qType"><option value="despesa">Fiz um gasto / paguei uma conta</option><option value="receita">Recebi uma receita</option></select></label><label class="full">Categoria<select id="qCat">'+ex.map(x=>'<option value="'+rows('expense').indexOf(x)+'">'+esc(x.category)+' · '+x.owner+'</option>').join('')+'</select></label><label>Valor<input id="qValue" type="number" step=".01" inputmode="decimal" autofocus></label><label>Data<input id="qDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label class="full">Observação (opcional)<input id="qNote"></label><button class="btn primary full" onclick="saveQuick()">Salvar lançamento</button></div>');document.querySelector('#qType').onchange=e=>{let type=e.target.value==='receita'?'income':'expense';document.querySelector('#qCat').innerHTML=scoped(type).map(x=>'<option value="'+rows(type).indexOf(x)+'">'+esc(x.category)+'</option>').join('')}}
function saveQuick(){let type=document.querySelector('#qType').value,arr=rows(type==='receita'?'income':'expense'),x=arr[+document.querySelector('#qCat').value],v=+document.querySelector('#qValue').value||0;if(!x||!v)return toast('Informe categoria e valor');db.actuals.push({id:crypto.randomUUID?.()||'a'+Date.now(),month,category:x.category,type,amount:v,date:document.querySelector('#qDate').value,note:document.querySelector('#qNote').value,owner:x.owner||incomeOwner(x.category)});persist();closeModal();render();toast(type==='receita'?'Receita registrada':'Despesa registrada')}
function openItem(type,i){let x=rows(type)[i];if(!x)return;let kind=type==='income'?'receita':'despesa',acts=actualsFor(x,kind);openModal('<div class="dialog-head"><div><h2>'+esc(isFree(x)?'Saldo Livre — '+freeOwner(x):x.category)+'</h2><div class="sub">'+label(month)+'</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">Nome<input id="eName" value="'+esc(x.category)+'"></label><label>Orçamento<input id="eBudget" type="number" step=".01" value="'+(+x.budget||0)+'"></label><label>Responsável<select id="eOwner"><option '+(x.owner==='Assis'?'selected':'')+'>Assis</option><option '+(x.owner==='Andressa'?'selected':'')+'>Andressa</option></select></label>'+(type==='expense'?'<label class="full">Como funciona?<select id="eBehavior"><option value="consumo" '+(x.behavior==='consumo'?'selected':'')+'>Vou gastando durante o mês</option><option value="obrigacao" '+(x.behavior!=='consumo'?'selected':'')+'>É uma conta a pagar</option></select></label>':'')+'<label class="full"><input id="eRecurring" type="checkbox" '+(x.recurring!==false?'checked':'')+'> Repetir no próximo mês</label><button class="btn primary full" onclick="saveItem(\''+type+'\','+i+')">Salvar alterações</button></div><div class="details"><h3>Lançamentos</h3>'+(acts.length?acts.map(a=>'<div class="money-row"><div><b>'+esc(a.date||'Sem data')+'</b><div class="meta">'+esc(a.note||'Sem observação')+'</div></div><b>'+money(a.amount)+'</b><button class="btn" onclick="editActual(\''+a.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum lançamento realizado.</div>')+'</div><button class="btn danger" onclick="deleteItem(\''+type+'\','+i+')">Excluir deste mês</button>')}
function saveItem(type,i){let x=rows(type)[i],old=x.category,newName=cleanName(document.querySelector('#eName').value.trim()||old,month);x.category=newName;x.budget=+document.querySelector('#eBudget').value||0;x.owner=document.querySelector('#eOwner').value;x.recurring=document.querySelector('#eRecurring').checked;if(type==='expense')x.behavior=document.querySelector('#eBehavior').value;if(x.recurring)Object.keys(db.budget).filter(k=>serial(k)>serial(month)).forEach(k=>rows(type,k).filter(y=>norm(y.category)===norm(old)&&y.owner===x.owner).forEach(y=>{y.category=cleanName(newName,k);y.recurring=x.recurring;if(type==='expense')y.behavior=x.behavior}));db.actuals.forEach(a=>{if(a.month===month&&norm(a.category)===norm(old)){a.category=newName;a.owner=x.owner}});persist();closeModal();render();toast('Alteração salva')}
function deleteItem(type,i){if(!confirm('Excluir este item somente de '+label(month)+'?'))return;rows(type).splice(i,1);persist();closeModal();render()}
function editActual(id){let a=db.actuals.find(x=>x.id===id);if(!a)return;openModal('<div class="dialog-head"><h2>Editar lançamento</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Valor<input id="aValue" type="number" step=".01" value="'+a.amount+'"></label><label>Data<input id="aDate" type="date" value="'+esc(a.date||'')+'"></label><label class="full">Observação<input id="aNote" value="'+esc(a.note||'')+'"></label><button class="btn primary" onclick="saveActual(\''+id+'\')">Salvar</button><button class="btn danger" onclick="deleteActual(\''+id+'\')">Excluir</button></div>')}
function saveActual(id){let a=db.actuals.find(x=>x.id===id);a.amount=+document.querySelector('#aValue').value||0;a.date=document.querySelector('#aDate').value;a.note=document.querySelector('#aNote').value;persist();closeModal();render();toast('Lançamento atualizado')}function deleteActual(id){if(!confirm('Excluir este lançamento?'))return;db.actuals=db.actuals.filter(x=>x.id!==id);persist();closeModal();render();toast('Lançamento excluído')}
function newItem(type){openModal('<div class="dialog-head"><h2>Nova '+(type==='income'?'receita':'despesa')+'</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label class="full">Nome<input id="nName" autofocus></label><label>Valor planejado<input id="nBudget" type="number" step=".01"></label><label>Responsável<select id="nOwner"><option '+(scopeValue==='Assis'?'selected':'')+'>Assis</option><option '+(scopeValue==='Andressa'?'selected':'')+'>Andressa</option></select></label>'+(type==='expense'?'<label class="full">Como funciona?<select id="nBehavior"><option value="consumo">Vou gastando durante o mês</option><option value="obrigacao">É uma conta a pagar</option></select></label>':'')+'<label class="full"><input type="checkbox" id="nRecurring" checked> Repetir no próximo mês</label><button class="btn primary full" onclick="saveNew(\''+type+'\')">Adicionar</button></div>')}
function saveNew(type){let name=document.querySelector('#nName').value.trim();if(!name)return toast('Informe um nome');let x={category:name,budget:+document.querySelector('#nBudget').value||0,owner:document.querySelector('#nOwner').value,recurring:document.querySelector('#nRecurring').checked};if(type==='expense')x.behavior=document.querySelector('#nBehavior').value;rows(type).push(x);persist();closeModal();render();toast('Item adicionado')}
function replicateModal(){let keys=Object.keys(db.budget).sort((a,b)=>serial(a)-serial(b)),prev=keys.filter(k=>serial(k)<serial(month)).at(-1);openModal('<div class="dialog-head"><h2>Replicar planejamento</h2><button class="btn" onclick="closeModal()">×</button></div><p>Copiar receitas e despesas recorrentes de <b>'+label(prev)+'</b> para <b>'+label(month)+'</b>?</p><p class="sub">Pagamentos e recebimentos realizados não serão copiados.</p><button class="btn primary" onclick="replicate(\''+prev+'\')">Replicar agora</button>')}
function replicate(from){if(!db.budget[from])return;db.budget[month]={income:db.budget[from].income.filter(x=>x.recurring!==false).map(clone),expense:db.budget[from].expense.filter(x=>x.recurring!==false).map(clone),closed:false};persist();closeModal();render();toast('Planejamento replicado')}
function editReserve(i){let r=db.reserves[i];openModal('<div class="dialog-head"><h2>'+esc(r.name)+'</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Saldo atual<input id="rValue" type="number" step=".01" value="'+(+r.principal||0)+'"></label><label>Taxa mensal (%)<input id="rRate" type="number" step=".01" value="'+(+r.rate||0)+'"></label><label class="full">Meta<input id="rGoal" type="number" step=".01" value="'+(+r.goal||0)+'"></label><button class="btn primary full" onclick="saveReserve('+i+')">Salvar</button></div>')}function saveReserve(i){let r=db.reserves[i];r.principal=+document.querySelector('#rValue').value||0;r.rate=+document.querySelector('#rRate').value||0;r.goal=+document.querySelector('#rGoal').value||0;persist();closeModal();render();toast('Reserva atualizada')}
let audioCtx;function sound(kind){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=kind==='soft'?520:420;g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.055);o.start();o.stop(audioCtx.currentTime+.06)}catch(e){}}function introMusic(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();[392,494,587,659,587,494,523,659].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.38;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.035,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.34);o.start(t);o.stop(t+.36)})}catch(e){}}
let syncTimer;function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{document.querySelector('#syncText').textContent='Salvo neste aparelho';},300)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();
</script>
</body></html>
