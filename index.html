function mergeArray(base,local,remote){let objects=[...base,...local,...remote].every(x=>x&&typeof x==='object'&&!Array.isArray(x));if(!objects)return same(local,base)?deepClone(remote):same(remote,base)?deepClone(local):deepClone(local);let keyed=[...base,...local,...remote].every(x=>objectKey(x));if(!keyed)return same(local,base)?deepClone(remote):same(remote,base)?deepClone(local):deepClone(local);let bm=new Map(base.map(x=>[objectKey(x),x])),lm=new Map(local.map(x=>[objectKey(x),x])),rm=new Map(remote.map(x=>[objectKey(x),x])),keys=[...new Set([...bm.keys(),...lm.keys(),...rm.keys()])],out=[];for(let k of keys){let b=bm.get(k),l=lm.get(k),r=rm.get(k);if(l===undefined&&b!==undefined){if(r!==undefined&&!same(r,b))out.push(deepClone(r));continue}if(r===undefined&&b!==undefined){if(l!==undefined&&!same(l,b))out.push(deepClone(l));continue}if(l===undefined){out.push(deepClone(r));continue}if(r===undefined){out.push(deepClone(l));continue}out.push(mergeState(b,l,r))}return out}
function mergeState(base,local,remote){if(same(local,base))return deepClone(remote);if(same(remote,base))return deepClone(local);if(Array.isArray(local)&&Array.isArray(remote))return mergeArray(Array.isArray(base)?base:[],local,remote);if(local&&remote&&typeof local==='object'&&typeof remote==='object'){let out={},b=base&&typeof base==='object'?base:{};for(let k of new Set([...Object.keys(b),...Object.keys(local),...Object.keys(remote)])){if(!(k in local)&&k in b){if(k in remote&&!same(remote[k],b[k]))out[k]=deepClone(remote[k]);continue}if(!(k in remote)&&k in b){if(k in local&&!same(local[k],b[k]))out[k]=deepClone(local[k]);continue}if(!(k in local)){out[k]=deepClone(remote[k]);continue}if(!(k in remote)){out[k]=deepClone(local[k]);continue}out[k]=mergeState(b[k],local[k],remote[k])}return out}return deepClone(local)}
function saveCloudMeta(){localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudMeta))}
function loadCloudMeta(){try{cloudMeta=Object.assign(cloudMeta,JSON.parse(localStorage.getItem(CLOUD_KEY))||{})}catch(e){}}
function syncStatus(text,state=''){let t=document.querySelector('#syncText'),d=document.querySelector('#syncDot');if(t)t.textContent=text;if(d)d.className='sync-dot '+state}
function scheduleSync(){cloudMeta.dirty=true;saveCloudMeta();clearTimeout(cloudTimer);if(!cloudLinked){syncStatus(navigator.onLine?'Salvo neste aparelho':'Offline · salvo no aparelho',navigator.onLine?'':'offline');return}syncStatus(navigator.onLine?'Sincronizando…':'Offline · sincronização pendente',navigator.onLine?'syncing':'offline');cloudTimer=setTimeout(pushCloud,450)}
async function ensureCloudAuth(){if(!window.supabase)throw new Error('Biblioteca de sincronização indisponível');supa=supa||window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});let{data,error}=await supa.auth.getSession();if(error)throw error;if(!data.session){let result=await supa.auth.signInAnonymously();if(result.error)throw result.error}return true}
async function cloudInit(){loadCloudMeta();if(!navigator.onLine){cloudReady=true;syncStatus('Offline · dados neste aparelho','offline');return}try{syncStatus('Conectando…','syncing');await ensureCloudAuth();let{data,error}=await supa.rpc('my_finance_state');if(error)throw error;let row=data&&data[0];if(row){cloudLinked=true;cloudMeta.householdId=row.household_id;let remote=normalize(row.payload||{}),base=cloudMeta.base?normalize(cloudMeta.base):deepClone(remote);if(cloudMeta.dirty){db=ensureReserveRates(normalize(mergeState(base,db,remote)));localStorage.setItem(KEY,JSON.stringify(db));cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(remote);saveCloudMeta();render();await pushCloud()}else{db=ensureReserveRates(remote);localStorage.setItem(KEY,JSON.stringify(db));cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(db);cloudMeta.dirty=false;saveCloudMeta();render();syncStatus('Sincronizado','online')}subscribeCloud()}else{cloudLinked=false;syncStatus('Sincronização não configurada','')}cloudReady=true;maybePromptCloud()}catch(e){cloudReady=true;syncStatus('Nuvem indisponível · dados seguros no aparelho','offline');console.warn('A&A cloud init',e)}}
function maybePromptCloud(){if(!cloudStarted||!cloudReady||cloudLinked||!localStorage.getItem(USER_KEY)||document.querySelector('#modal').classList.contains('open'))return;cloudPrompt()}
function cloudPrompt(){let u=localStorage.getItem(USER_KEY)||'Assis',andressa=u==='Andressa';openModal('<div class="dialog-head"><div><h2>Unir os dois celulares</h2><div class="sub">Sincronização segura do casal</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="cloud-box"><h3>'+(andressa?'Andressa, entre na família de Assis':esc(u)+', configure a família')+'</h3><p class="sub">'+(andressa?'Digite o código criado por Assis. Este aparelho não criará uma segunda família.':'Se a família já foi criada, use Entrar na família.')+'</p><div class="form"><label class="full">Código familiar<input class="cloud-code" id="familyCode" minlength="6" autocomplete="off" placeholder="Código com 6 ou mais caracteres"></label></div><div class="cloud-actions" style="grid-template-columns:'+(andressa?'1fr':'1fr 1fr')+'">'+(andressa?'':'<button class="btn primary" onclick="createCloudFamily()">Criar família</button>')+'<button class="btn '+(andressa?'primary':'soft')+'" onclick="joinCloudFamily()">Entrar na família</button></div><div class="cloud-note">A conexão é feita com segurança pelo Supabase.</div></div>')}
function openSyncSettings(){if(!cloudLinked)return cloudPrompt();openModal('<div class="dialog-head"><h2>Sincronização do casal</h2><button class="btn" onclick="closeModal()">×</button></div><div class="cloud-box"><h3>Conectado em tempo real</h3><p class="sub">As alterações de Assis e Andressa são compartilhadas automaticamente. Sem internet, o app salva neste aparelho e envia quando a conexão voltar.</p><button class="btn primary" onclick="closeModal();cloudMeta.dirty=true;saveCloudMeta();pushCloud()">Sincronizar agora</button></div>')}
function familyCode(){return(document.querySelector('#familyCode')?.value||'').trim().toUpperCase()}
async function createCloudFamily(){let code=familyCode(),user=localStorage.getItem(USER_KEY);if(code.length<6)return toast('Use um código com pelo menos 6 caracteres');try{syncStatus('Criando família…','syncing');await ensureCloudAuth();let{data,error}=await supa.rpc('create_household',{p_display_name:user,p_invite_code:code,p_payload:db});if(error)throw error;let row=data?.[0];if(!row)throw new Error('EMPTY_FAMILY_RESPONSE');cloudLinked=true;cloudMeta={householdId:row.household_id,revision:+row.revision,base:deepClone(db),dirty:false};saveCloudMeta();closeModal();subscribeCloud();syncStatus('Sincronizado · família criada','online');toast('Família criada. Use o mesmo código no celular de Andressa')}catch(e){syncStatus('Falha ao criar família','offline');console.error('A&A create family',e);toast(cloudError(e))}}
async function joinCloudFamily(){let code=familyCode(),user=localStorage.getItem(USER_KEY);if(code.length<6)return toast('Informe o código familiar');try{syncStatus('Entrando na família…','syncing');await ensureCloudAuth();let{data,error}=await supa.rpc('join_household',{p_display_name:user,p_invite_code:code});if(error)throw error;let row=data?.[0];if(!row)throw new Error('EMPTY_FAMILY_RESPONSE');db=ensureReserveRates(normalize(row.payload||{}));localStorage.setItem(KEY,JSON.stringify(db));cloudLinked=true;cloudMeta={householdId:row.household_id,revision:+row.revision,base:deepClone(db),dirty:false};saveCloudMeta();closeModal();render();subscribeCloud();syncStatus('Sincronizado com o casal','online');toast('Celular conectado com sucesso')}catch(e){syncStatus('Não foi possível entrar','offline');console.error('A&A join family',e);toast(cloudError(e))}}
function cloudError(e){let m=String(e?.message||e||'');if(m.includes('INVALID_CODE'))return'Código familiar incorreto';if(m.includes('ALREADY_LINKED'))return'Este aparelho já está vinculado';if(m.includes('CODE_TOO_SHORT'))return'O código precisa ter ao menos 6 caracteres';if(m.includes('Anonymous sign-ins are disabled'))return'Acesso anônimo está desativado no Supabase';if(m.includes('Failed to fetch')||m.includes('NetworkError'))return'Sem conexão com o Supabase. Verifique a internet.';if(m.includes('EMPTY_FAMILY_RESPONSE'))return'O Supabase não devolveu os dados da família.';return'Falha de sincronização: '+m.slice(0,90)}
async function pushCloud(){if(!cloudLinked||cloudSaving||!navigator.onLine||!cloudMeta.dirty)return;cloudSaving=true;try{await ensureCloudAuth();let{data,error}=await supa.rpc('save_finance_state',{p_household_id:cloudMeta.householdId,p_expected_revision:cloudMeta.revision,p_payload:db});if(error)throw error;let row=data&&data[0];if(!row)throw new Error('EMPTY_SYNC');if(row.saved){cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(db);cloudMeta.dirty=false;saveCloudMeta();syncStatus('Sincronizado agora','online')}else{let remote=normalize(row.payload||{}),merged=ensureReserveRates(normalize(mergeState(cloudMeta.base||remote,db,remote)));db=merged;localStorage.setItem(KEY,JSON.stringify(db));cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(remote);cloudMeta.dirty=true;saveCloudMeta();render();setTimeout(pushCloud,80)}}catch(e){syncStatus('Pendente · salvo no aparelho','offline');console.warn('A&A cloud save',e)}finally{cloudSaving=false}}
function subscribeCloud(){if(!supa||!cloudMeta.householdId)return;if(cloudChannel)supa.removeChannel(cloudChannel);cloudChannel=supa.channel('aa-finance-'+cloudMeta.householdId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'finance_state',filter:'household_id=eq.'+cloudMeta.householdId},payload=>{let row=payload.new;if(!row||+row.revision<=cloudMeta.revision)return;let remote=normalize(row.payload||{});if(cloudMeta.dirty){db=ensureReserveRates(normalize(mergeState(cloudMeta.base||remote,db,remote)));cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(remote);cloudMeta.dirty=true;localStorage.setItem(KEY,JSON.stringify(db));saveCloudMeta();render();setTimeout(pushCloud,90)}else{db=ensureReserveRates(remote);localStorage.setItem(KEY,JSON.stringify(db));cloudMeta.revision=+row.revision;cloudMeta.base=deepClone(db);saveCloudMeta();render();syncStatus('Atualizado pelo outro celular','online')}}).subscribe(status=>{if(status==='SUBSCRIBED'&&!cloudMeta.dirty)syncStatus('Sincronizado em tempo real','online')})}
const normalizeV36=normalize;normalize=function(d){let result=normalizeV36(d);result.version=38;return result};db.version=38;
const renderHomeBase=renderHome;renderHome=function(){renderHomeBase();let hero=document.querySelector('#v-home .hero');if(hero)hero.insertAdjacentHTML('afterend',dreOverviewHTML())}
const renderPlanBase=renderPlan;renderPlan=function(){renderPlanBase();let tabs=document.querySelector('#v-plan .plan-tabs');if(tabs)tabs.insertAdjacentHTML('beforeend','<button class="btn primary" onclick="createNextMonth()">＋ Próximo mês</button>')}
window.addEventListener('online',()=>{syncStatus('Reconectando…','syncing');if(!supa)cloudInit();else if(cloudLinked)pushCloud();else maybePromptCloud()});window.addEventListener('offline',()=>syncStatus('Offline · salvo no aparelho','offline'));
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();cloudInit();
</script>
